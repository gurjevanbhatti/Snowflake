<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>for you ❄</title>
<style>
  :root {
    --pink: #ff9ccf; --pink2: #d4d4d4; --ice: #bfe6ff;
    --term: #1e1e1e; --bar: #323233; --edge: #3c3c3c; --text: #d4d4d4; --dim: #858585; --prompt: #9cdcfe;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #000;
    color: var(--text); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overflow: hidden; display: grid; place-items: center; padding: 16px;
  }
  canvas#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .term {
    position: relative; z-index: 1; width: min(560px, 100%); border-radius: 10px; background: var(--term);
    border: 1px solid var(--edge); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    overflow: hidden; transition: width .9s ease;
  }
  .bar { display: flex; align-items: center; gap: 7px; padding: 9px 12px; background: var(--bar); border-bottom: 1px solid var(--edge); }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .bar .title { flex: 1; text-align: center; font-size: 12px; color: #cccccc; margin-right: 40px; letter-spacing: .3px; }
  .body { padding: 14px 16px 18px; min-height: 380px; }
  .line { font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .prompt { color: var(--prompt); }
  .ok { color: #4ec9b0; }
  .dim { color: var(--dim); }
  .cursor { display: inline-block; width: 8px; height: 1.05em; background: #aeafad; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  pre#flake { margin: 8px auto 0; text-align: center; line-height: 1; font-size: 10px; letter-spacing: 0; min-height: 0; transition: font-size .9s ease; user-select: none; }
  .q { text-align: center; font-size: clamp(17px, 4.6vw, 22px); color: #fff; margin: 14px 0 4px; min-height: 1.4em; text-shadow: 0 0 18px rgba(191, 230, 255, 0.35); }
  .btns { position: relative; display: flex; justify-content: center; gap: 18px; margin-top: 14px; height: 52px; opacity: 0; transition: opacity .5s; }
  .btns.show { opacity: 1; }
  button {
    font: inherit; font-size: 15px; border-radius: 999px; padding: 11px 26px; cursor: pointer; border: 0;
    transition: transform .25s, background .25s;
  }
  #yes { background: #3c3c3c; color: #ffffff; border: 1px solid #5a5a5a; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); font-weight: 700; }
  #yes:hover { background: #4a4a4a; }
  #no { background: #2d2d2d; color: #cccccc; border: 1px solid var(--edge); }
  #no.loose { position: fixed; z-index: 5; transition: left .75s cubic-bezier(.25,.8,.3,1), top .75s cubic-bezier(.25,.8,.3,1), transform .6s ease; }
  .msg { text-align: center; color: var(--pink2); font-size: 13px; min-height: 1.4em; margin-top: 26px; }
  .sig { text-align: right; color: var(--dim); font-size: 12px; margin-top: 12px; opacity: 0; transition: opacity 1s; }
  .sig.show { opacity: 1; }
  .yay .q { color: var(--pink2); }
  .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .term.big { width: min(900px, 100%); }
  .term.big .btns { display: none; }
  canvas#snow { opacity: 0; transition: opacity .3s; }
  canvas#snow.on { opacity: 1; }
  .hearts span { position: absolute; top: -40px; color: #fff; animation: fall linear forwards; text-shadow: 0 0 8px rgba(191, 230, 255, 0.7); }
  @keyframes fall { to { transform: translateY(115vh) rotate(200deg); } }
  .replay { display: block; margin: 12px auto 0; background: transparent; color: var(--dim); font-size: 12px; padding: 4px 10px; opacity: 0; transition: opacity 1s; }
  .replay.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="snow"></canvas>
<main class="term" id="term">
  <div class="bar">
    <span class="dot" style="background:#ff5f57"></span>
    <span class="dot" style="background:#febc2e"></span>
    <span class="dot" style="background:#28c840"></span>
    <span class="title" id="title">for_you.py</span>
  </div>
  <div class="body">
    <div id="log"></div>
    <pre id="flake" aria-hidden="true"></pre>
    <div class="q" id="q"></div>
    <div class="btns" id="btns"><button id="yes">yes ❄️</button><button id="no">no</button></div>
    <div class="msg" id="msg"></div>
    <button class="replay" id="replay">↻ run again</button>
  </div>
</main>
<div class="hearts" id="hearts"></div>

<script>
// ---------- personalise with ?to=Name&from=Name ----------
const P = new URLSearchParams(location.search);
const TO = (P.get("to") || "").slice(0, 30);
const FROM = (P.get("from") || "").slice(0, 30);
const QUESTION = P.get("q") ? P.get("q").slice(0, 80) : "will you be my snowflake this christmas?";
document.getElementById("title").textContent = TO ? `for_${TO.toLowerCase().replace(/\W+/g, "_")}.py` : "for_you.py";

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// ---------- falling snow background ----------
const sc = $("snow"), sx = sc.getContext("2d");
let flakes = [];
function sizeSnow() { sc.width = innerWidth * devicePixelRatio; sc.height = innerHeight * devicePixelRatio; }
sizeSnow(); addEventListener("resize", sizeSnow);
for (let i = 0; i < 220; i++) flakes.push({ x: Math.random(), y: Math.random(), r: 0.6 + Math.random() * 2.2, v: 0.0006 + Math.random() * 0.0014, p: Math.random() * 6.28, pink: false });
let snowPink = false, party = false, snowTimer = null;
function snowLoop(t) {
  sx.clearRect(0, 0, sc.width, sc.height);
  for (const f of flakes) {
    f.y += f.v; if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); }
    const x = (f.x + Math.sin(t / 1800 + f.p) * 0.01) * sc.width, y = f.y * sc.height;
    sx.beginPath(); sx.arc(x, y, f.r * devicePixelRatio, 0, 6.29);
    sx.fillStyle = f.r > 1.9 ? "rgba(191,230,255,.85)" : "rgba(240,248,255,.85)";
    sx.fill();
  }
  requestAnimationFrame(snowLoop);
}
requestAnimationFrame(snowLoop);

// ---------- spinning 3D ascii snowflake (same idea as snowflake.py) ----------
const SHADE = ".:-=+*#%@";
const WHITE = ["#5a5a5a", "#7a7a7a", "#9a9a9a", "#b8b8b8", "#d0d0d0", "#e2e2e2", "#efefef", "#f7f7f7", "#ffffff", "#ffffff"];
const ICE = ["#4f7d9c", "#6b9cbd", "#86b6d6", "#a3cde9", "#bfe0f5", "#d2eafb", "#e2f2fd", "#eef8ff", "#f6fbff", "#ffffff"];
let pal = { a: WHITE, b: ICE };
const BLUE = ["#1f4e7a", "#2a6aa3", "#3a86c8", "#4f9bdb", "#62abe8", "#76baf0", "#8ac7f6", "#9dd2fa", "#b3ddfc", "#c9e8fe"];

function build() {
  const pts = [], TH = 0.03;
  function slab(p0, p1, w0, w1, tip) {
    const dx = p1[0] - p0[0], dy = p1[1] - p0[1], L = Math.hypot(dx, dy);
    const px = -dy / L, py = dx / L, n = Math.max(2, Math.floor(L / 0.016));
    for (let i = 0; i <= n; i++) {
      const t = i / n, w = w0 + (w1 - w0) * t, cx = p0[0] + dx * t, cy = p0[1] + dy * t;
      const m = Math.max(1, Math.floor(w / 0.012));
      for (let j = -m; j <= m; j++) {
        const s = j / m, bv = s * 0.8, l = Math.hypot(px * bv, py * bv, 1);
        const ridge = 0.25 * (1 - Math.abs(s)) ** 2;
        for (const side of [1, -1])
          pts.push([cx + px * w * s, cy + py * w * s, side * TH * (1 - Math.abs(s) * 0.6), px * bv / l, py * bv / l, side / l, tip, ridge, t]);
      }
    }
  }
  for (let k = 0; k < 6; k++) {
    const a = k * Math.PI / 3, ca = Math.cos(a), sa = Math.sin(a);
    const rot = (x, y) => [x * ca - y * sa, x * sa + y * ca];
    slab(rot(0, 0.1), rot(0, 1), 0.055, 0.025, 0);
    for (const [pos, ln, w] of [[0.32, 0.3, 0.035], [0.58, 0.27, 0.03], [0.8, 0.15, 0.024]])
      for (const sd of [-1, 1]) slab(rot(0, pos), rot(sd * ln * Math.sin(Math.PI / 3), pos + ln * Math.cos(Math.PI / 3)), w, w * 0.45, pos > 0.7 ? 1 : 0);
    slab(rot(0, 0.95), rot(0, 1.09), 0.05, 0, 1);
    const b = (k + 1) * Math.PI / 3;
    slab([0.16 * -Math.sin(a), 0.16 * Math.cos(a)], [0.16 * -Math.sin(b), 0.16 * Math.cos(b)], 0.024, 0.024, 0);
  }
  for (let r = 1; r <= 5; r++) {
    const rr = r / 5 * 0.1, n = Math.floor(rr * 120) + 6;
    for (let j = 0; j < n; j++) { const ph = j / n * 6.283; for (const sd of [1, -1]) pts.push([rr * Math.cos(ph), rr * Math.sin(ph), sd * 0.035 * (1 - rr / 0.1), Math.cos(ph) * rr * 4, Math.sin(ph) * rr * 4, sd, 1, 0.15, 0]); }
  }
  return pts;
}
const PTS = build();
const COLS = 72, ROWS = 33, ASPECT = 1.9; // monospace chars are ~2x taller than wide
let L = [-0.4, 0.55, 0.75]; { const n = Math.hypot(...L); L = L.map((v) => v / n); }
let spinBoost = 0.45, BASE_SPIN = 0.45, whipAt = 0;
const sparkles = Array.from({ length: 26 }, () => { const a = Math.random() * 6.28, r = 0.25 + Math.random() * 0.9; return [r * Math.cos(a), r * Math.sin(a), (Math.random() - 0.5) * 0.1, Math.random() * 6.28, 1.5 + Math.random() * 2.5]; });

let spinT = 0, lastT = 0;
function renderFlake(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0); lastT = now;
  if (whipAt) { const e = (now - whipAt) / 1000; spinBoost = BASE_SPIN + 14 * Math.exp(-e / 0.45); if (e > 3) whipAt = 0; }
  spinT += dt * spinBoost;
  const t = spinT, chars = new Array(COLS * ROWS).fill(" "), cols = new Array(COLS * ROWS).fill(null), z = new Float32Array(COLS * ROWS).fill(-1e9);
  const scale = (ROWS - 2) / 2.3, cx = COLS / 2, cy = ROWS / 2;
  const sp = t * 0.9, tw = t * 0.25, tl = 0.25;
  const cs = Math.cos(sp), ss = Math.sin(sp), cw = Math.cos(tw), sw = Math.sin(tw), ct = Math.cos(tl), st = Math.sin(tl);
  const xf = (x, y, zz) => { let X = x * cw - y * sw, Y = x * sw + y * cw; let Z; [X, Z] = [X * cs + zz * ss, -X * ss + zz * cs]; [Y, Z] = [Y * ct - Z * st, Y * st + Z * ct]; return [X, Y, Z]; };
  const plot = (c, r, d, ch, col) => { if (r >= 0 && r < ROWS && c >= 0 && c < COLS) { const i = r * COLS + c; if (d > z[i]) { z[i] = d; chars[i] = ch; cols[i] = col; } } };
  const glint = (t * 0.6) % 1.4;
  for (const p of PTS) {
    const [X, Y, Z] = xf(p[0], p[1], p[2]), [NX, NY, NZ] = xf(p[3], p[4], p[5]);
    let d = NX * L[0] + NY * L[1] + NZ * L[2]; if (d < 0) d = -d * 0.6;
    const sh = Math.abs(p[8] - glint) < 0.06 ? 0.35 : 0;
    const b = Math.min(0.999, Math.max(0, 0.1 + 0.7 * d + p[7] + sh));
    const f = 4 / (4 - Z), P2 = p[6] ? pal.b : pal.a;
    const P3 = party && (p[6] || Math.hypot(p[0], p[1]) > 0.5) ? BLUE : P2;
    plot(Math.floor(cx + X * f * scale * ASPECT), Math.floor(cy - Y * f * scale), Z, SHADE[Math.floor(b * SHADE.length)], P3[Math.floor(b * P3.length)]);
  }
  for (const s of sparkles) {
    const [X, Y, Z] = xf(s[0], s[1], s[2]), f = 4 / (4 - Z), w = Math.sin(t * s[4] + s[3]);
    const ch = w > 0.85 ? "*" : w > 0.5 ? "+" : w > 0.2 ? "·" : null;
    if (ch) plot(Math.floor(cx + X * f * scale * ASPECT), Math.floor(cy - Y * f * scale), Z + 0.1, ch, "#fff");
  }
  let html = "";
  for (let r = 0; r < ROWS; r++) {
    let cur = null, run = "";
    for (let c = 0; c < COLS; c++) {
      const i = r * COLS + c, col = chars[i] === " " ? cur : cols[i];
      if (col !== cur) { if (run) html += cur ? `<span style="color:${cur}">${esc(run)}</span>` : run; run = ""; cur = col; }
      run += chars[i];
    }
    if (run) html += cur ? `<span style="color:${cur}">${esc(run)}</span>` : run;
    html += "\n";
  }
  $("flake").innerHTML = html;
}
let bigFlake = false;
function fitFlake() {
  const w = $("flake").parentElement.clientWidth - 8;
  $("flake").style.fontSize = Math.min(bigFlake ? 20 : 13, w / (COLS * 0.6), bigFlake ? (innerHeight - 400) / ROWS : 99) + "px";
}
addEventListener("resize", fitFlake);
let flakeOn = false;
function flakeLoop(now) { if (flakeOn) renderFlake(now); requestAnimationFrame(flakeLoop); }
requestAnimationFrame(flakeLoop);

// ---------- the terminal story ----------
const log = $("log");
function addLine(html, cls = "") { const d = document.createElement("div"); d.className = "line " + cls; d.innerHTML = html; log.appendChild(d); return d; }
async function type(el, text, speed = 42, prefix = "") {
  const cur = '<span class="cursor"></span>';
  for (let i = 1; i <= text.length; i++) { el.innerHTML = prefix + esc(text.slice(0, i)) + cur; await sleep(speed + Math.random() * 30); }
  el.innerHTML = prefix + esc(text);
}

async function story() {
  log.innerHTML = ""; $("flake").innerHTML = ""; $("q").textContent = ""; $("msg").textContent = "";
  $("btns").classList.remove("show"); $("replay").classList.remove("show");
  flakeOn = false; pal = { a: WHITE, b: ICE }; spinBoost = BASE_SPIN = 0.45; whipAt = 0;
  $("term").classList.remove("big"); $("snow").classList.remove("on"); bigFlake = false;
  await sleep(500);
  const cmd = addLine("");
  await type(cmd, `python3 ${$("title").textContent}`, 55, '<span class="prompt">~ $ </span>');
  await sleep(450);
  const l1 = addLine("", "dim"); await type(l1, TO ? `hi ${TO} :)` : "hi you :)", 50);
  await sleep(300);
  const l2 = addLine("", "dim"); await type(l2, "i made you something...", 50);
  await sleep(300);
  const l3 = addLine("");
  for (let i = 0; i <= 12; i++) { l3.innerHTML = `<span class="dim">loading </span><span class="prompt">[${"█".repeat(i)}${"·".repeat(12 - i)}]</span> ${Math.round(i / 12 * 100)}%`; await sleep(70 + Math.random() * 60); }
  l3.innerHTML += ' <span class="ok">✓</span>';
  await sleep(400);
  fitFlake(); flakeOn = true;
  await sleep(1300);
  await type($("q"), QUESTION, 45);
  $("btns").classList.add("show");
}

// ---------- the runaway "no" ----------
const NO_LINES = ["error: answer not found", "are you sure? 🥺", "that button is broken, sorry", "try the other one", "permission denied ❄", "no is not in my code", "pls 🥹"];
let noCount = 0;
let lastRun = 0;
function runAway() {
  if (performance.now() - lastRun < 650) return;  // let it finish moving before it dodges again
  lastRun = performance.now();
  const b = $("no"), r = b.getBoundingClientRect();
  if (!b.classList.contains("loose")) { b.style.left = r.left + "px"; b.style.top = r.top + "px"; b.classList.add("loose"); }
  const pad = 20, w = r.width, h = r.height;
  let x, y, tries = 0;
  do { x = pad + Math.random() * (innerWidth - w - pad * 2); y = pad + Math.random() * (innerHeight - h - pad * 2); tries++; }
  while (Math.hypot(x - r.left, y - r.top) < 160 && tries < 20);
  b.style.left = x + "px"; b.style.top = y + "px";
  noCount++;
  b.style.transform = `scale(${Math.max(0.12, Math.pow(0.82, noCount))})`;
  $("yes").style.transform = `scale(${Math.min(1.8, 1 + noCount * 0.09)})`;
  $("msg").textContent = NO_LINES[(noCount - 1) % NO_LINES.length];
  spinBoost = BASE_SPIN + Math.min(noCount, 6) * 0.4; setTimeout(() => (spinBoost = BASE_SPIN), 600);
}
$("no").addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") runAway(); });
$("no").addEventListener("pointerdown", (e) => { e.preventDefault(); runAway(); });
$("no").addEventListener("click", (e) => { e.preventDefault(); });

// ---------- yes! ----------
$("yes").addEventListener("click", async () => {
  $("btns").classList.remove("show"); $("no").classList.remove("loose"); $("no").style.cssText = ""; $("yes").style.transform = "";
  $("msg").textContent = ""; noCount = 0;
  spinBoost = 3; snowPink = true; party = true; $("term").classList.add("party");
  BASE_SPIN = 1.6; whipAt = performance.now();
  $("flake").animate([{ transform: "scale(1)" }, { transform: "scale(1.18)", offset: 0.25 }, { transform: "scale(1)" }], { duration: 900, easing: "cubic-bezier(.2,.8,.2,1)" });
  bigFlake = true; $("term").classList.add("big");
  for (const f of flakes) { f.y = -0.02 - Math.random() * 1.1; f.v = 0.0012 + Math.random() * 0.0018; }  // start above the screen and fall in
  $("snow").classList.add("on");
  fitFlake(); setTimeout(fitFlake, 950);
  const H = $("hearts");
  const drop = (delay) => {
    const s = document.createElement("span");
    s.textContent = ["❄", "❅", "❆"][Math.floor(Math.random() * 3)];
    s.style.left = Math.random() * 100 + "vw"; s.style.fontSize = 14 + Math.random() * 22 + "px";
    s.style.color = Math.random() < 0.45 ? "#bfe6ff" : "#ffffff";
    s.style.animationDuration = 5 + Math.random() * 4 + "s"; s.style.animationDelay = delay + "s";
    H.appendChild(s); setTimeout(() => s.remove(), (delay + 10) * 1000);
  };
  for (let i = 0; i < 40; i++) drop(Math.random() * 2);
  clearInterval(snowTimer); snowTimer = setInterval(() => party && drop(0), 220);
  $("q").textContent = "";
  await type($("q"), "yay!! you're my snowflake now ❄️", 55);
  const out = addLine("", "ok"); await type(out, "> answer saved forever. no take backs.", 30);
  $("replay").classList.add("show");
});
$("replay").addEventListener("click", () => { snowPink = false; party = false; $("term").classList.remove("party"); story(); });

story();
</script>
</body>
</html>
